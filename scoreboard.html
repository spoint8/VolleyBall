<!DOCTYPE html>

<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>暗黑護眼運動計分板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0f12;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部控制列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background-color: #14171d;
      border-bottom: 1px solid #262b36;
      z-index: 10;
    }

    .top-bar button {
      background-color: #1f242d;
      color: #cbd5e1;
      border: 1px solid #333b48;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .top-bar button:active {
      background-color: #2d3543;
      color: #fff;
    }

    .set-display {
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 2px;
      background: #090a0d;
      color: #f8fafc;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid #2d3543;
    }

    /* 主計分區 */
    .board {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 10px;
      padding: 10px;
      background-color: #0d0f12;
    }

    @media (orientation: portrait) {
      .board {
        flex-direction: column;
      }
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      border-radius: 16px;
      background-color: #161920;
      border: 2px solid #262b36;
      transition: transform 0.08s, background-color 0.15s;
    }

    .team:active {
      transform: scale(0.99);
      background-color: #1d222b;
    }

    /* 暗黑護眼雙隊配色 */
    .theme-red {
      border-color: rgba(248, 113, 113, 0.35);
      box-shadow: inset 0 0 40px rgba(248, 113, 113, 0.05);
    }
    .theme-red .score {
      color: #fca5a5;
    }
    .theme-red .team-name {
      color: #fecaca;
      border-bottom: 2px solid rgba(248, 113, 113, 0.4);
    }

    .theme-blue {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: inset 0 0 40px rgba(56, 189, 248, 0.05);
    }
    .theme-blue .score {
      color: #7dd3fc;
    }
    .theme-blue .team-name {
      color: #bae6fd;
      border-bottom: 2px solid rgba(56, 189, 248, 0.4);
    }

    .team-name {
      font-size: 22px;
      font-weight: bold;
      background: transparent;
      border: none;
      text-align: center;
      padding: 4px 12px;
      margin-bottom: 12px;
      width: 65%;
      max-width: 220px;
      outline: none;
    }

    .score {
      font-size: 27vmin;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    /* 發球權標示 */
    .serve-badge {
      margin-top: 14px;
      padding: 5px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      background-color: rgba(250, 204, 21, 0.15);
      color: #fde047;
      border: 1px solid rgba(250, 204, 21, 0.4);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .serve-badge.active {
      opacity: 1;
    }

    /* 扣分按鈕 */
    .minus-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #1e232c;
      border: 1px solid #384152;
      color: #94a3b8;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .minus-btn:active {
      background: #2e3644;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button onclick="swapSides()">⇄ 換邊</button>
    <div class="set-display">
      局數 <span id="setLeft">0</span> : <span id="setRight">0</span>
    </div>
    <div>
      <button onclick="nextSet()">結束本局</button>
      <button onclick="resetAll()" style="margin-left: 6px;">歸零</button>
    </div>
  </div>

  <div class="board">
    <div class="team theme-red" id="boxLeft" onclick="addScore('left')">
      <input type="text" class="team-name" id="nameLeft" value="主隊" onclick="event.stopPropagation()">
      <div class="score" id="scoreLeft">0</div>
      <div class="serve-badge active" id="serveLeft">🏐 發球權</div>
      <button class="minus-btn" onclick="subScore(event, 'left')">-</button>
    </div>

    <div class="team theme-blue" id="boxRight" onclick="addScore('right')">
      <input type="text" class="team-name" id="nameRight" value="客隊" onclick="event.stopPropagation()">
      <div class="score" id="scoreRight">0</div>
      <div class="serve-badge" id="serveRight">🏐 發球權</div>
      <button class="minus-btn" onclick="subScore(event, 'right')">-</button>
    </div>
  </div>

  <script>
    let state = {
      left: { name: '主隊', score: 0, sets: 0, theme: 'theme-red' },
      right: { name: '客隊', score: 0, sets: 0, theme: 'theme-blue' },
      serve: 'left'
    };

    window.onload = () => {
      const saved = localStorage.getItem('darkScoreState');
      if (saved) {
        state = JSON.parse(saved);
        render();
      }
    };

    function saveState() {
      state.left.name = document.getElementById('nameLeft').value;
      state.right.name = document.getElementById('nameRight').value;
      localStorage.setItem('darkScoreState', JSON.stringify(state));
    }

    function render() {
      document.getElementById('nameLeft').value = state.left.name;
      document.getElementById('scoreLeft').innerText = state.left.score;
      document.getElementById('setLeft').innerText = state.left.sets;
      document.getElementById('boxLeft').className = 'team ' + state.left.theme;

      document.getElementById('nameRight').value = state.right.name;
      document.getElementById('scoreRight').innerText = state.right.score;
      document.getElementById('setRight').innerText = state.right.sets;
      document.getElementById('boxRight').className = 'team ' + state.right.theme;

      document.getElementById('serveLeft').classList.toggle('active', state.serve === 'left');
      document.getElementById('serveRight').classList.toggle('active', state.serve === 'right');
      saveState();
    }

    function addScore(side) {
      state[side].score++;
      state.serve = side;
      render();
    }

    function subScore(event, side) {
      event.stopPropagation();
      if (state[side].score > 0) {
        state[side].score--;
        render();
      }
    }

    function swapSides() {
      saveState();
      const temp = { ...state.left };
      state.left = { ...state.right };
      state.right = temp;
      state.serve = state.serve === 'left' ? 'right' : 'left';
      render();
    }

    function nextSet() {
      if (state.left.score === 0 && state.right.score === 0) return;
      if (state.left.score > state.right.score) {
        state.left.sets++;
      } else if (state.right.score > state.left.score) {
        state.right.sets++;
      }
      state.left.score = 0;
      state.right.score = 0;
      render();
    }

    function resetAll() {
      if (confirm('確定要將所有分數與局數歸零嗎？')) {
        state.left.score = 0;
        state.left.sets = 0;
        state.right.score = 0;
        state.right.sets = 0;
        state.serve = 'left';
        render();
      }
    }

    document.getElementById('nameLeft').addEventListener('input', saveState);
    document.getElementById('nameRight').addEventListener('input', saveState);
  </script>


</body></html>
